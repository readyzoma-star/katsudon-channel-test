<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9bd9ff">
<title>SKY GARDEN — Character Archive</title>
<meta name="description" content="四人の来訪者と空中庭園を巡る、インタラクティブなアニメ・キャラクターギャラリー。">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap');
:root{--ink:#17293a;--glass:rgba(246,252,255,.66);--line:rgba(255,255,255,.74);--gold:#bc9850;--blue:#3d88b8;--shadow:0 24px 70px rgba(47,91,118,.24)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:'Noto Sans JP',system-ui,sans-serif;color:var(--ink);background:#9ddcff}button{font:inherit}
.sky{position:fixed;inset:0;overflow:hidden;background:linear-gradient(180deg,#63b9ee 0%,#b9e7ff 43%,#edf9ff 72%,#dff1dc 100%)}
.sky:before{content:"";position:absolute;inset:-8%;background:radial-gradient(ellipse at 18% 18%,rgba(255,255,255,.93) 0 7%,transparent 7.4%),radial-gradient(ellipse at 28% 20%,rgba(255,255,255,.77) 0 6%,transparent 6.4%),radial-gradient(ellipse at 77% 27%,rgba(255,255,255,.78) 0 7%,transparent 7.5%),radial-gradient(ellipse at 84% 28%,rgba(255,255,255,.67) 0 5%,transparent 5.5%),linear-gradient(180deg,transparent 0 67%,rgba(255,255,255,.48) 68% 100%);filter:blur(2px);transform:scale(1.08)}
.horizon{position:fixed;left:50%;bottom:8vh;transform:translateX(-50%);width:min(86vw,1200px);height:25vh;border-radius:50% 50% 22% 22%/70% 70% 25% 25%;background:radial-gradient(ellipse at 50% 18%,#f8fff5 0 25%,#b7dc9d 26% 43%,#75a56e 44% 53%,#688871 54% 57%,transparent 58%),linear-gradient(180deg,transparent,#8aa87d);filter:drop-shadow(0 28px 24px rgba(45,77,69,.26));opacity:.94}
.horizon:before,.horizon:after{content:"";position:absolute;bottom:32%;width:23%;height:60%;border:clamp(7px,1vw,14px) solid rgba(252,254,255,.9);border-bottom:0;border-radius:110px 110px 0 0;box-shadow:inset 0 0 0 2px rgba(182,203,210,.3)}.horizon:before{left:13%;transform:perspective(300px) rotateY(20deg)}.horizon:after{right:13%;transform:perspective(300px) rotateY(-20deg)}
.island{position:fixed;width:24vw;max-width:340px;height:9vw;max-height:120px;border-radius:50%;background:radial-gradient(ellipse at 50% 15%,#ebf9dc 0 38%,#89b77b 40% 56%,#617c69 57% 63%,transparent 65%);opacity:.78;filter:drop-shadow(0 26px 18px rgba(47,76,77,.2))}.i1{left:-4vw;bottom:24vh;transform:rotate(-7deg)}.i2{right:-6vw;bottom:31vh;transform:rotate(9deg) scale(.8)}
.glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.2),transparent 42%),linear-gradient(90deg,rgba(255,255,255,.11),transparent 18%,transparent 82%,rgba(255,255,255,.11));z-index:2}
.brand{position:fixed;z-index:30;top:max(18px,env(safe-area-inset-top));left:clamp(16px,3vw,42px);pointer-events:none;text-shadow:0 2px 16px rgba(255,255,255,.7)}.brand .k{font:700 10px/1 'Cinzel',serif;letter-spacing:.34em;color:#7a6133}.brand h1{font:700 clamp(22px,3vw,42px)/1 'Cinzel',serif;letter-spacing:.08em;margin:8px 0 0;color:#18364e}.brand p{margin:8px 0 0;font-size:10px;letter-spacing:.16em;color:#46657a}
.hud{position:fixed;z-index:35;right:clamp(12px,2.4vw,30px);top:max(16px,env(safe-area-inset-top));display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;max-width:64vw}.chip{border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(15px);border-radius:999px;padding:8px 11px;color:#294b61;font:700 9px/1 'Cinzel',serif;letter-spacing:.1em;box-shadow:0 8px 26px rgba(73,110,133,.13);cursor:pointer}.chip:hover{background:rgba(255,255,255,.86)}
.gallery{position:fixed;inset:0;z-index:10;perspective:1300px;perspective-origin:50% 46%;touch-action:pan-y}
.ring{position:absolute;left:50%;top:51%;width:min(88vw,1160px);height:min(70vh,720px);transform:translate(-50%,-50%);transform-style:preserve-3d;transition:transform .75s cubic-bezier(.2,.75,.2,1)}
.card{--x:0px;--z:0px;--r:0deg;position:absolute;left:50%;top:50%;width:clamp(172px,22vw,320px);aspect-ratio:2/3;transform:translate(-50%,-50%) translateX(var(--x)) translateZ(var(--z)) rotateY(var(--r));transform-style:preserve-3d;border:0;background:transparent;padding:0;cursor:pointer;transition:transform .72s cubic-bezier(.2,.75,.2,1),filter .5s,opacity .5s;filter:saturate(.86) brightness(.94);opacity:.72}.card img{width:100%;height:100%;object-fit:cover;display:block;border-radius:28px;box-shadow:0 28px 72px rgba(40,73,98,.3);border:1px solid rgba(255,255,255,.82)}.card:after{content:"";position:absolute;inset:0;border-radius:28px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.42),inset 0 -90px 80px rgba(18,42,57,.12);pointer-events:none}.card.active{--z:170px;filter:saturate(1.03) brightness(1.02);opacity:1;z-index:10}.card.active img{box-shadow:0 40px 100px rgba(42,77,101,.32),0 0 0 7px rgba(255,255,255,.18)}
.card[data-pos="left"]{--x:clamp(-420px,-30vw,-240px);--r:14deg}.card[data-pos="right"]{--x:clamp(240px,30vw,420px);--r:-14deg}.card[data-pos="far"]{--x:0px;--z:-360px;--r:0deg;opacity:.2;filter:blur(1px) saturate(.7)}
.caption{position:absolute;left:50%;bottom:-48px;transform:translateX(-50%);width:120%;text-align:center;pointer-events:none;opacity:0;transition:.4s}.active .caption{opacity:1}.caption b{display:block;font:700 13px 'Cinzel',serif;letter-spacing:.16em;color:#203f54}.caption span{font-size:10px;letter-spacing:.12em;color:#5b7381}
.quote-layer{position:fixed;inset:0;z-index:45;pointer-events:none;overflow:hidden}.quote{position:absolute;left:50%;top:18%;max-width:min(84vw,620px);transform:translate(-50%,12px) scale(.96);padding:13px 18px;border:1px solid rgba(255,255,255,.82);border-radius:18px;background:rgba(248,253,255,.82);backdrop-filter:blur(16px);box-shadow:0 20px 54px rgba(55,91,116,.22);font-weight:700;font-size:clamp(13px,1.8vw,18px);letter-spacing:.05em;text-align:center;color:#24465c;opacity:0;animation:quoteIn 3.9s ease forwards}.quote small{display:block;margin-top:6px;font:700 8px 'Cinzel',serif;letter-spacing:.2em;color:#9a7640}@keyframes quoteIn{0%{opacity:0;transform:translate(-50%,16px) scale(.96)}10%,78%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-12px) scale(.99)}}
.panel{position:fixed;z-index:32;left:clamp(14px,3vw,42px);bottom:max(18px,env(safe-area-inset-bottom));width:min(380px,42vw);padding:14px 16px;border:1px solid var(--line);border-radius:18px;background:rgba(247,253,255,.65);backdrop-filter:blur(18px);box-shadow:var(--shadow)}.panel .eyebrow{font:700 8px 'Cinzel',serif;letter-spacing:.24em;color:#9a7640}.panel h2{margin:6px 0 5px;font-size:15px;letter-spacing:.08em}.panel p{margin:0;font-size:10px;line-height:1.65;color:#526b7a}.panel .credit{margin-top:7px;font-size:9px;color:#6a7f8c}.dots{display:flex;gap:7px;margin-top:11px}.dot{width:7px;height:7px;border:0;border-radius:50%;padding:0;background:#adc1ca;cursor:pointer}.dot.active{background:#83672f;transform:scale(1.35)}
.hint{position:fixed;z-index:31;right:clamp(14px,2.4vw,30px);bottom:max(20px,env(safe-area-inset-bottom));font:600 9px/1.6 'Cinzel',serif;letter-spacing:.12em;text-align:right;color:#4b6778;text-shadow:0 1px 10px #fff;pointer-events:none}
@media(max-width:760px){.brand p{display:none}.brand h1{font-size:20px}.hud{top:auto;bottom:max(12px,env(safe-area-inset-bottom));left:12px;right:12px;max-width:none;justify-content:center}.panel{left:12px;right:12px;bottom:68px;width:auto;padding:11px 13px}.panel p{display:none}.panel .credit{margin-top:4px}.hint{display:none}.ring{top:47%;height:64vh}.card{width:min(58vw,270px)}.card[data-pos="left"]{--x:-58vw;--r:13deg}.card[data-pos="right"]{--x:58vw;--r:-13deg}.card.active{--z:100px}.caption{bottom:-38px}.quote{top:13%;font-size:13px}.horizon{bottom:12vh;width:120vw}.island{display:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div><div class="island i1" aria-hidden="true"></div><div class="island i2" aria-hidden="true"></div><div class="horizon" aria-hidden="true"></div><div class="glow" aria-hidden="true"></div>
<header class="brand"><div class="k">INTERACTIVE CHARACTER ARCHIVE</div><h1>SKY GARDEN</h1><p>四人の来訪者と、雲上の庭園を巡る。</p></header>
<div class="hud"><button class="chip" id="prev">PREV</button><button class="chip" id="random">RANDOM</button><button class="chip" id="next">NEXT</button><button class="chip" id="voice">ZUNDA VOICE ON</button></div>
<main class="gallery" id="gallery" aria-label="キャラクターギャラリー"><div class="ring" id="ring"></div></main>
<div class="quote-layer" id="quoteLayer" aria-live="polite"></div>
<section class="panel"><div class="eyebrow" id="eyebrow">VISITOR 01</div><h2 id="name">蒼穹の案内人</h2><p id="desc">柔らかな風をまとった、空中庭園の案内役。画面をタップすると、その時の気分で一言。</p><div class="credit">音声：VOICEVOX:ずんだもん</div><div class="dots" id="dots"></div></section>
<div class="hint">TAP — QUOTE &amp; VOICE<br>SWIPE — CHANGE VISITOR</div>
<script>
const visitors=[
 {name:'蒼穹の案内人',tag:'AZURE ATTENDANT',img:'assets/sky-garden/01-attendant.webp',desc:'柔らかな風をまとった、空中庭園の案内役。画面をタップすると、その時の気分で一言。',quotes:['空の庭園へようこそ。今日は少しだけ、そばにいてください。','雲の向こうまで行ってみます？　ちゃんと案内しますから。','急がなくても大丈夫。ここでは風まで、のんびりしています。']},
 {name:'紫苑の兎姫',tag:'VIOLET HARE',img:'assets/sky-garden/02-hare.webp',desc:'しなやかな仕草と、いたずらっぽい視線。退屈な空気を一瞬で舞台に変える来訪者。',quotes:['そんなに見つめたら、踊りたくなっちゃうじゃない。','次はどこへ行く？　私、じっとしてるの苦手なの。','ふふっ、ついて来られるなら来てみて。']},
 {name:'白銀の角姫',tag:'SILVER HORN',img:'assets/sky-garden/03-horn.webp',desc:'静かな気配と凛とした横顔。高い回廊で、風の音に耳を澄ませている。',quotes:['静かにして。風の音まで、ちゃんと聞きたいの。','ここ、悪くないわね。もう少しだけ居てもいい。','見失わないで。私は先に行くから。']},
 {name:'朱夏の舞姫',tag:'SCARLET DANCER',img:'assets/sky-garden/04-dancer.webp',desc:'陽光のような自信と華やかさ。庭園の端まで、迷いなく手を差し伸べてくる。',quotes:['ほら、迷ってないで。こっちに来なさいな。','空の上だって、楽しんだ者勝ちでしょ？','ちゃんと見てて。次はもっと大胆にいくから。']}
];
const ring=document.getElementById('ring'),gallery=document.getElementById('gallery'),quoteLayer=document.getElementById('quoteLayer'),dots=document.getElementById('dots'),nameEl=document.getElementById('name'),eye=document.getElementById('eyebrow'),desc=document.getElementById('desc');
let active=0,voiceEnabled=localStorage.getItem('skyGardenVoice')!=='0',audio=null,quoteNo=0,touchX=null;
visitors.forEach((v,i)=>{const b=document.createElement('button');b.className='card';b.dataset.i=i;b.innerHTML=`<img src="${v.img}" alt="${v.name}"><div class="caption"><b>${v.tag}</b><span>${v.name}</span></div>`;b.addEventListener('click',e=>{e.stopPropagation();if(active!==i){active=i;render();setTimeout(()=>speakCurrent(),220)}else speakCurrent()});ring.appendChild(b);const d=document.createElement('button');d.className='dot';d.ariaLabel=`${v.name}を表示`;d.onclick=e=>{e.stopPropagation();active=i;render()};dots.appendChild(d)});
function render(){const cards=[...ring.children];cards.forEach((c,i)=>{const delta=(i-active+visitors.length)%visitors.length;c.classList.toggle('active',delta===0);c.dataset.pos=delta===0?'center':delta===1?'right':delta===visitors.length-1?'left':'far'});[...dots.children].forEach((d,i)=>d.classList.toggle('active',i===active));const v=visitors[active];eye.textContent=`VISITOR ${String(active+1).padStart(2,'0')} / ${v.tag}`;nameEl.textContent=v.name;desc.textContent=v.desc}
function step(n){active=(active+n+visitors.length)%visitors.length;render()}
document.getElementById('prev').onclick=e=>{e.stopPropagation();step(-1)};document.getElementById('next').onclick=e=>{e.stopPropagation();step(1)};document.getElementById('random').onclick=e=>{e.stopPropagation();let n=active;while(n===active)n=Math.floor(Math.random()*visitors.length);active=n;render()};
const voiceBtn=document.getElementById('voice');function syncVoice(){voiceBtn.textContent=voiceEnabled?'ZUNDA VOICE ON':'ZUNDA VOICE OFF'}syncVoice();voiceBtn.onclick=e=>{e.stopPropagation();voiceEnabled=!voiceEnabled;localStorage.setItem('skyGardenVoice',voiceEnabled?'1':'0');if(!voiceEnabled&&audio){audio.pause();audio=null}syncVoice()};
const API='https://api.tts.quest/v3/voicevox/synthesis',SPEAKER=3,cache=new Map();async function synth(text){if(cache.has(text))return cache.get(text);const u=new URL(API);u.searchParams.set('speaker',SPEAKER);u.searchParams.set('text',text);const r=await fetch(u,{mode:'cors',cache:'no-store'});const d=await r.json();const url=d.mp3StreamingUrl||d.mp3DownloadUrl;if(!url)throw new Error(d.errorMessage||'VOICE API error');cache.set(text,url);return url}
async function playVoice(text){if(!voiceEnabled)return;try{const url=await synth(text);if(audio)audio.pause();audio=new Audio(url);audio.volume=.92;await audio.play()}catch(err){console.debug('Zundamon voice unavailable:',err)}}
function showQuote(text,v){quoteLayer.textContent='';const q=document.createElement('div');q.className='quote';q.innerHTML=`<span>${text}</span><small>${v.tag} — TAP VOICE</small>`;quoteLayer.appendChild(q);setTimeout(()=>q.remove(),4000)}
function speakCurrent(){const v=visitors[active],text=v.quotes[quoteNo++%v.quotes.length];showQuote(text,v);playVoice(text)}
gallery.addEventListener('click',e=>{if(e.target===gallery||e.target===ring)speakCurrent()});document.body.addEventListener('click',e=>{if(e.target.closest('.chip,.card,.dot'))return;if(!e.target.closest('.gallery'))speakCurrent()});
gallery.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].clientX},{passive:true});gallery.addEventListener('touchend',e=>{if(touchX==null)return;const dx=e.changedTouches[0].clientX-touchX;touchX=null;if(Math.abs(dx)>50)step(dx<0?1:-1)},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1);if(e.key==='Enter'||e.key===' ')speakCurrent()});
render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>カツドンチャンネル FAN ARCHIVE</title>
<meta name="description" content="カツドンチャンネルを楽しむための非公式ファンアーカイブ。重なりを抑えた3Dギャラリーを巡りながら記録を眺めるファンページ。">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap');
:root{--bg:#dff1ff;--panel:rgba(12,22,30,.66);--line:rgba(255,255,255,.28);--gold:#d3a83d;--text:#f7f9fb;--muted:#d9e4ea;--glass:blur(16px)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;overflow:hidden}
.zoo-bg{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,#a7dcff 0%,#dff4ff 46%,#eff8ef 46%,#eff8ef 100%);overflow:hidden}.zoo-bg:before{content:'';position:absolute;inset:0;background:radial-gradient(100% 50% at 50% 100%,rgba(117,171,97,.9) 0 48%,transparent 49%),radial-gradient(60% 28% at 18% 85%,#82be69 0 48%,transparent 49%),radial-gradient(55% 30% at 82% 84%,#75b55f 0 48%,transparent 49%),radial-gradient(30px 30px at 9% 61%,#58924d 0 96%,transparent 100%),radial-gradient(38px 38px at 16% 57%,#4e8645 0 96%,transparent 100%),radial-gradient(28px 28px at 86% 60%,#5d9950 0 96%,transparent 100%),radial-gradient(36px 36px at 92% 56%,#4f8445 0 96%,transparent 100%),linear-gradient(180deg,transparent 0 62%,#9acb83 62% 71%,#bddda6 71% 100%)}.zoo-bg:after{content:'八木山動物公園';position:absolute;left:50%;bottom:19%;transform:translateX(-50%);padding:12px 26px;border-radius:16px;background:rgba(255,252,242,.92);border:3px solid #836633;color:#5f4b1f;font-weight:700;letter-spacing:.18em;box-shadow:0 10px 28px rgba(63,59,35,.18)}.zoo-path{position:fixed;left:50%;bottom:-6vh;transform:translateX(-50%);width:min(48vw,620px);height:34vh;z-index:0;background:linear-gradient(180deg,rgba(235,226,205,.2),rgba(221,205,171,.86));clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);filter:blur(.3px)}
.stage{position:fixed;inset:0;z-index:1}.stage iframe{width:100%;height:100%;border:0;display:block;background:transparent}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 48%,transparent 22%,rgba(154,201,160,.06) 64%,rgba(68,97,59,.28) 100%);z-index:2}.grain{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.09;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E")}
.brand,.nav,.info,.corner{transition:opacity .25s ease,transform .25s ease}.brand{position:fixed;z-index:10;top:20px;left:24px;pointer-events:none;text-shadow:0 2px 16px #000}.brand .kicker{font:500 10px/1 'Cinzel',serif;letter-spacing:.34em;color:var(--gold);margin-bottom:8px}.brand h1{font-size:clamp(18px,2.1vw,30px);line-height:1.15;letter-spacing:.09em;margin:0}.brand small{display:block;margin-top:6px;font:500 10px/1.4 'Cinzel',serif;letter-spacing:.24em;color:var(--muted)}
.nav{position:fixed;z-index:12;left:22px;top:50%;transform:translateY(-42%);width:min(290px,27vw);padding:16px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,rgba(10,10,18,.82),rgba(8,8,14,.48));backdrop-filter:var(--glass);box-shadow:0 20px 70px rgba(0,0,0,.35)}.nav-head{display:flex;align-items:center;justify-content:space-between;padding:0 3px 12px}.nav-head span{font:700 10px/1 'Cinzel',serif;letter-spacing:.25em;color:#aaa3b4}.badge{padding:4px 7px;border:1px solid rgba(201,162,39,.3);border-radius:999px;font-size:9px;color:var(--gold)}
.item{appearance:none;width:100%;border:0;border-top:1px solid rgba(255,255,255,.055);background:transparent;color:inherit;text-align:left;padding:12px 7px;cursor:pointer;display:grid;grid-template-columns:28px 1fr;gap:8px;transition:.25s}.item:first-of-type{border-top:0}.item:hover,.item.active{transform:translateX(3px);background:linear-gradient(90deg,rgba(201,162,39,.09),transparent)}.num{font:700 10px 'Cinzel',serif;color:var(--gold);padding-top:2px}.item strong{display:block;font-size:12px;letter-spacing:.06em}.item em{display:block;font-style:normal;font-size:10px;color:var(--muted);margin-top:3px;line-height:1.45}
.info{position:fixed;z-index:12;right:22px;bottom:22px;width:min(370px,32vw);padding:18px 19px;border:1px solid var(--line);border-radius:18px;background:var(--panel);backdrop-filter:var(--glass);box-shadow:0 20px 70px rgba(0,0,0,.35)}.info .eyebrow{font:700 9px 'Cinzel',serif;letter-spacing:.27em;color:var(--gold)}.info h2{font-size:17px;margin:6px 0 7px;letter-spacing:.06em}.info p{font-size:11px;line-height:1.75;color:#bbb5c4;margin:0}.actions{display:flex;gap:8px;margin-top:14px}.action,.restore-ui{border:1px solid var(--line);background:rgba(8,8,14,.72);color:#ddd5e2;border-radius:999px;padding:7px 11px;font:600 9px 'Cinzel',serif;letter-spacing:.12em;cursor:pointer;backdrop-filter:var(--glass)}.action:hover,.restore-ui:hover{border-color:rgba(201,162,39,.55);color:#f2df9d}
.corner{position:fixed;right:22px;top:22px;z-index:12;font:500 9px 'Cinzel',serif;letter-spacing:.16em;color:#7f7a88;text-align:right;line-height:1.7;pointer-events:none}.corner b{color:#c6bfca;font-weight:500}.restore-ui{position:fixed;z-index:30;right:18px;top:18px;opacity:0;pointer-events:none;transform:translateY(-6px);box-shadow:0 12px 40px rgba(0,0,0,.4)}
body.ui-hidden .brand,body.ui-hidden .nav,body.ui-hidden .info,body.ui-hidden .corner{opacity:0;pointer-events:none}body.ui-hidden .restore-ui{opacity:1;pointer-events:auto;transform:none}
.loading-note{position:fixed;left:50%;top:50%;z-index:1;transform:translate(-50%,-50%);font:500 10px 'Cinzel',serif;letter-spacing:.25em;color:#77717f;pointer-events:none}.comment-layer{position:fixed;inset:0;z-index:22;pointer-events:none;overflow:hidden}.nico-comment{position:absolute;left:100vw;white-space:nowrap;font-weight:700;letter-spacing:.02em;text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 2px 8px rgba(0,0,0,.9);will-change:transform;animation:nicoFlow var(--duration,8s) linear forwards}@keyframes nicoFlow{from{transform:translateX(0)}to{transform:translateX(calc(-100vw - 130%))}}.nico-comment.flood{font-weight:800;text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 3px 12px rgba(0,0,0,.95)}
@media(max-width:760px){.brand{top:14px;left:15px}.brand small{display:none}.corner{display:none}.nav{left:10px;right:10px;bottom:10px;top:auto;transform:none;width:auto;padding:8px;display:flex;gap:5px;overflow:auto;border-radius:15px}.nav-head{display:none}.item{min-width:54px;width:54px;height:45px;padding:7px 4px;display:block;text-align:center;border:0;border-radius:10px}.item .num{font-size:11px}.item strong,.item em{display:none}.item.active{transform:none;background:rgba(201,162,39,.12)}.info{left:12px;right:12px;bottom:68px;width:auto;padding:13px 15px}.info h2{font-size:14px}.info p{font-size:10px;line-height:1.6}.actions{margin-top:9px}.action{padding:6px 9px}.restore-ui{right:12px;top:12px;padding:8px 10px}.vignette{background:linear-gradient(to bottom,rgba(5,5,10,.25),transparent 22%,transparent 70%,rgba(5,5,10,.64))}}
</style>
</head>
<body>
<div class="zoo-bg" aria-hidden="true"></div><div class="zoo-path" aria-hidden="true"></div>
<div class="loading-note" id="loadingNote">PREPARING GALLERY...</div>
<div class="stage"><iframe id="galleryFrame" title="3D Gallery"></iframe></div>
<div class="vignette"></div><div class="grain"></div><div class="comment-layer" id="commentLayer" aria-live="polite"></div>
<header class="brand"><div class="kicker">UNOFFICIAL FAN ARCHIVE</div><h1>カツドンチャンネル</h1><small>MEMORY / SCENE / VISUAL COLLECTION</small></header>
<div class="corner"><b>FAN ARCHIVE 007</b><br>DRAG IMAGE / TAP QUOTE / ZOOM<br><span style="opacity:.55">BUILD 007</span></div>
<nav class="nav" id="nav"><div class="nav-head"><span>ARCHIVE INDEX</span><i class="badge">6 FILES</i></div></nav>
<section class="info" id="info"><div class="eyebrow" id="eyebrow">ARCHIVE 01</div><h2 id="title">KEY VISUAL</h2><p id="desc">画像同士が重なりにくいワイドな3D配置で、ファン目線のビジュアルをゆっくり巡れます。</p><div class="actions"><button class="action" id="random">RANDOM</button><button class="action" id="resetLayout">RESET LAYOUT</button><button class="action" id="quiet">UI HIDE</button></div></section>
<button class="restore-ui" id="restoreUi" type="button" aria-label="UIを再表示">SHOW UI</button>
<script>
const FAN_BUILD='20260817-1805-v7';
const archive=[
['KEY VISUAL','まずはここから。画像同士の間隔を広げた3D展示室でメインビジュアルを楽しめます。'],
['PROFILE SHEET','人物の雰囲気や表情、衣装、空気感をじっくり見るためのファン向け記録。'],
['CITY ILLUSTRATION','背景や街の空気まで含めて世界観を味わうためのシーンアーカイブ。'],
['SCENE CAPTURE','一瞬の表情や構図を切り取って眺める、場面鑑賞用の記録。'],
['ARCHIVE CLIP','繰り返し見返したくなるカットを集めていくためのファイル。'],
['COMMENT STREAM','ファン同士で語りたくなるポイントを残すためのメモ枠。']
];
const nav=document.getElementById('nav'),title=document.getElementById('title'),desc=document.getElementById('desc'),eye=document.getElementById('eyebrow'),frame=document.getElementById('galleryFrame'),loadingNote=document.getElementById('loadingNote'),commentLayer=document.getElementById('commentLayer');
const quotePool=[
'あなたのインナーチャイルド、今日も元気？','尊厳が破壊される','来るなら、来い','次世代を代表するセルフエクスプレッショナー','店味','アイブライト','宇宙の采配','感謝感激雨嵐','草回避www','のっぴきならない事情','成ったか','寝方ミスった','みんな楽しんでくれててよかった','睡眠が壊れる','ちゃんと出来るように頑張る。','すみ！','にんげんは しっぱいするもの まなぶもの'
];
const commentColors=['#ffffff','#ffe76a','#7de8ff','#ff9de2','#a8ff9f','#ffb36a'];
let current=-1,lastQuote=-1,lastTappedImage=-1,sameImageTapCount=0;
function makeComment(text,{top=null,size=null,color=null,duration=null,delay=0,className=''}={}){const el=document.createElement('div');el.className='nico-comment'+(className?' '+className:'');el.textContent=text;el.style.top=top??`${8+Math.random()*72}%`;el.style.fontSize=size??`${18+Math.floor(Math.random()*12)}px`;el.style.color=color??commentColors[Math.floor(Math.random()*commentColors.length)];el.style.setProperty('--duration',duration??`${2.05+Math.random()*1.25}s`);if(delay)el.style.animationDelay=`-${delay}s`;commentLayer.appendChild(el);el.addEventListener('animationend',()=>el.remove(),{once:true});return el}
function emitQuote(){let n=lastQuote;while(n===lastQuote)n=Math.floor(Math.random()*quotePool.length);lastQuote=n;makeComment(quotePool[n]);}
function floodMoralQuote(){const text='モラルのある盗撮をお願いします';const rows=18;for(let r=0;r<rows;r++){for(let c=0;c<3;c++){const top=`${2+r*(94/(rows-1))}%`;makeComment(text,{top,size:`${18+(r%3)*5}px`,color:commentColors[(r+c)%commentColors.length],duration:`${2.15+((r+c)%4)*0.22}s`,delay:c*0.5,className:'flood'})}}}
function handleImageTap(i){if(i===lastTappedImage)sameImageTapCount+=1;else{lastTappedImage=i;sameImageTapCount=1}if(sameImageTapCount>=3){sameImageTapCount=0;lastTappedImage=-1;floodMoralQuote()}else emitQuote()}

archive.forEach((a,i)=>{const b=document.createElement('button');b.className='item'+(i===0?' active':'');b.innerHTML=`<span class="num">0${i+1}</span><span><strong>${a[0]}</strong><em>${a[1]}</em></span>`;b.onclick=()=>select(i);nav.appendChild(b)});
function focusCurrent(){frame.contentWindow?.postMessage({type:'fan-focus-image',index:current},'*')}
function select(i){const changed=current!==i;current=i;[...nav.querySelectorAll('.item')].forEach((x,n)=>x.classList.toggle('active',n===i));eye.textContent=`ARCHIVE 0${i+1}`;title.textContent=archive[i][0];desc.textContent=archive[i][1];if(changed)focusCurrent()}
function setUiHidden(hidden){document.body.classList.toggle('ui-hidden',hidden);document.getElementById('quiet').textContent=hidden?'UI SHOW':'UI HIDE'}
document.getElementById('random').onclick=()=>{let n=current;while(n===current)n=Math.floor(Math.random()*archive.length);select(n)};
document.getElementById('resetLayout').onclick=()=>{localStorage.removeItem('fanGalleryPositions');loadGallery()};
document.getElementById('quiet').onclick=()=>setUiHidden(true);
document.getElementById('restoreUi').onclick=()=>setUiHidden(false);
addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='6')select(Number(e.key)-1);if(e.key.toLowerCase()==='r')document.getElementById('random').click();if(e.key.toLowerCase()==='h')setUiHidden(!document.body.classList.contains('ui-hidden'));if(e.key==='Escape')setUiHidden(false)});
addEventListener('message',e=>{if(e.source!==frame.contentWindow||e.data?.type!=='fan-image-tap')return;const i=Number(e.data.index);if(Number.isInteger(i)&&i>=0&&i<archive.length){select(i);handleImageTap(i)}});

const spaciousLayout=`const imageData = [
  {'x': -5.8, 'y': 2.6, 'z': 0.0, 'scale': 2.8, 'rotY': 0.12},
  {'x':  0.0, 'y': 2.6, 'z': -0.7, 'scale': 3.0, 'rotY': 0.0},
  {'x':  5.6, 'y': 2.6, 'z': 0.0, 'scale': 1.9, 'rotY': -0.10},
  {'x': -5.5, 'y': -2.3, 'z': 0.7, 'scale': 2.2, 'rotY': 0.10},
  {'x':  0.0, 'y': -2.3, 'z': -0.2, 'scale': 2.2, 'rotY': 0.0},
  {'x':  5.5, 'y': -2.3, 'z': 0.7, 'scale': 2.5, 'rotY': -0.10}
];`;
const interactionCode=`const fanRaycaster = new THREE.Raycaster();
    const fanPointer = new THREE.Vector2();
    const fanTap = { object:null, x:0, y:0, pointerId:null };
    let fanFocusedIndex = 0;
    renderer.domElement.style.touchAction='none';
    function fanSetPointer(e){const r=renderer.domElement.getBoundingClientRect();fanPointer.x=((e.clientX-r.left)/r.width)*2-1;fanPointer.y=-((e.clientY-r.top)/r.height)*2+1;fanRaycaster.setFromCamera(fanPointer,camera)}
    function fanSavePositions(){const saved={};planes.forEach(m=>{if(Number.isInteger(m.userData.index))saved[m.userData.index]={x:m.userData.baseX,y:m.userData.baseY,z:m.userData.baseZ}});try{localStorage.setItem('fanGalleryPositions',JSON.stringify(saved))}catch(e){}}
    function fanApplyFocus(index){fanFocusedIndex = Number.isInteger(index) ? index : fanFocusedIndex; controls.target.lerp(new THREE.Vector3(0,0.15,0),0.22);}
    window.addEventListener('message',e=>{if(e.data?.type==='fan-focus-image'){const idx=Number(e.data.index);if(Number.isInteger(idx))fanApplyFocus(idx)}});
    const fanDragControls = new DragControls(planes,camera,renderer.domElement);
    fanDragControls.addEventListener('hoveron',()=>renderer.domElement.style.cursor='grab');
    fanDragControls.addEventListener('hoveroff',()=>renderer.domElement.style.cursor='default');
    fanDragControls.addEventListener('dragstart',e=>{const u=e.object.userData;controls.enabled=false;renderer.domElement.style.cursor='grabbing';u.fanDragging=true;u.dragOffsetX=e.object.position.x-u.baseX;u.dragOffsetY=e.object.position.y-u.baseY;u.dragOffsetZ=e.object.position.z-u.baseZ;fanFocusedIndex=u.index;});
    fanDragControls.addEventListener('drag',e=>{const u=e.object.userData;u.baseX=e.object.position.x-u.dragOffsetX;u.baseY=e.object.position.y-u.dragOffsetY;u.baseZ=e.object.position.z-u.dragOffsetZ;});
    fanDragControls.addEventListener('dragend',e=>{const u=e.object.userData;u.baseX=e.object.position.x-u.dragOffsetX;u.baseY=e.object.position.y-u.dragOffsetY;u.baseZ=e.object.position.z-u.dragOffsetZ;u.fanDragging=false;u.dragOffsetX=u.dragOffsetY=u.dragOffsetZ=0;controls.enabled=true;renderer.domElement.style.cursor='grab';fanSavePositions()});
    renderer.domElement.addEventListener('pointerdown',e=>{fanSetPointer(e);const hit=fanRaycaster.intersectObjects(planes,false)[0];fanTap.object=hit?hit.object:null;fanTap.x=e.clientX;fanTap.y=e.clientY;fanTap.pointerId=e.pointerId});
    renderer.domElement.addEventListener('pointerup',e=>{if(fanTap.pointerId!==e.pointerId||!fanTap.object)return;const moved=Math.hypot(e.clientX-fanTap.x,e.clientY-fanTap.y)>8;const target=fanTap.object;fanTap.object=null;fanTap.pointerId=null;if(!moved&&!target.userData.fanDragging){fanFocusedIndex=target.userData.index;window.parent.postMessage({type:'fan-image-tap',index:target.userData.index},'*')}});
    renderer.domElement.addEventListener('pointercancel',()=>{fanTap.object=null;fanTap.pointerId=null});
    renderer.domElement.addEventListener('dblclick',e=>{e.preventDefault();e.stopPropagation();},{passive:false});

    const clock = new THREE.Clock();`;
async function loadGallery(){
  loadingNote.style.display='block';loadingNote.textContent='PREPARING GALLERY...';frame.srcdoc='';
  try{
    const res=await fetch('./index.html?v='+encodeURIComponent(FAN_BUILD),{cache:'no-store'});if(!res.ok)throw new Error(`HTTP ${res.status}`);
    let html=await res.text();
    const pattern=/const imageData = \[[\s\S]*?\];/;
    if(!pattern.test(html))throw new Error('imageData not found');
    html=html.replace(pattern,spaciousLayout)
      .replace("import { OrbitControls } from 'three/addons/controls/OrbitControls.js';","import { OrbitControls } from 'three/addons/controls/OrbitControls.js';\n    import { DragControls } from 'three/addons/controls/DragControls.js';")
      .replace('scene.background = new THREE.Color(0x05050a);','scene.background = null;')
      .replace('scene.fog = new THREE.FogExp2(0x05050a, 0.012);','scene.fog = new THREE.FogExp2(0xd5eac8, 0.014);')
      .replace('const renderer = new THREE.WebGLRenderer({ antialias: true });','const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });')
      .replace('camera.position.set(0, 1.5, 13);','camera.position.set(0, 0.2, 16.5);')
      .replace('controls.target.set(0, 0.6, 0);','controls.target.set(0, 0.1, 0);')
      .replace('mesh.position.set(data.x, data.y, data.z);',`mesh.position.set(data.x, data.y, data.z);
      try { const saved=JSON.parse(localStorage.getItem('fanGalleryPositions')||'{}')[index]; if(saved) mesh.position.set(saved.x,saved.y,saved.z); } catch(e) {}`)
      .replace('baseY: data.y,','baseX: mesh.position.x,\n        baseY: mesh.position.y,\n        baseZ: mesh.position.z,\n        index,')
      .replace('floatAmp: 0.11 + (index % 2) * 0.05','floatAmp: 0.045 + (index % 2) * 0.018')
      .replace(`planes.forEach((mesh) => {
        const u = mesh.userData;
        mesh.position.y = u.baseY + Math.sin(t * u.floatSpeed + u.phase) * u.floatAmp;
        mesh.rotation.y = u.baseRotY + Math.sin(t * 0.2 + u.phase) * 0.035;
        mesh.rotation.z = Math.sin(t * 0.16 + u.phase * 0.6) * 0.012;
      });`,`planes.forEach((mesh) => {
        const u = mesh.userData;
        const focused = fanFocusedIndex === u.index;
        if (u.fanDragging) {
          mesh.rotation.y = THREE.MathUtils.lerp(mesh.rotation.y, 0, 0.22);
          mesh.rotation.z = THREE.MathUtils.lerp(mesh.rotation.z, 0, 0.22);
          return;
        }
        const floatY = u.baseY + Math.sin(t * u.floatSpeed + u.phase) * u.floatAmp;
        const idleRotY = u.baseRotY + Math.sin(t * 0.2 + u.phase) * 0.028;
        const idleRotZ = Math.sin(t * 0.16 + u.phase * 0.6) * 0.009;
        const targetX = focused ? THREE.MathUtils.lerp(u.baseX, 0, 0.42) : u.baseX;
        const targetY = focused ? THREE.MathUtils.lerp(floatY, 0.15, 0.35) : floatY;
        const targetZ = focused ? u.baseZ + 3.6 : u.baseZ;
        const targetRotY = focused ? 0 : idleRotY;
        const targetRotZ = focused ? 0 : idleRotZ;
        mesh.position.x = THREE.MathUtils.lerp(mesh.position.x, targetX, focused ? 0.16 : 0.12);
        mesh.position.y = THREE.MathUtils.lerp(mesh.position.y, targetY, focused ? 0.16 : 0.12);
        mesh.position.z = THREE.MathUtils.lerp(mesh.position.z, targetZ, focused ? 0.18 : 0.14);
        mesh.rotation.y = THREE.MathUtils.lerp(mesh.rotation.y, targetRotY, focused ? 0.18 : 0.10);
        mesh.rotation.z = THREE.MathUtils.lerp(mesh.rotation.z, targetRotZ, focused ? 0.18 : 0.10);
      });`)
      .replace('const clock = new THREE.Clock();',interactionCode)
      .replace('</head>','<style>.ui.title,.ui.hint{display:none!important}</style></head>');
    frame.srcdoc=html;
    frame.addEventListener('load',()=>{loadingNote.style.display='none';setTimeout(()=>focusCurrent(),120)},{once:true});
  }catch(err){
    console.error('Fan gallery layout patch failed:',err);frame.src='./index.html';loadingNote.textContent='GALLERY FALLBACK';setTimeout(()=>loadingNote.style.display='none',1500);
  }
}
select(0);
loadGallery();
</script>
</body>
</html>

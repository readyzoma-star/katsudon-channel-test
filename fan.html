<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>カツドンチャンネル FAN ARCHIVE</title>
<style>html,body{margin:0;width:100%;height:100%;background:#dff1ff;color:#24313a;font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center}.loading{font-weight:700;letter-spacing:.15em}</style>
</head>
<body>
<div class="loading">BUILD 010 LOADING...</div>
<script>
(async()=>{
  try{
    const r=await fetch('./build009/part1.txt?v=10',{cache:'no-store'});
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    let html=await r.text();
    html=html.replaceAll('FAN ARCHIVE 009','FAN ARCHIVE 010').replaceAll('BUILD 009','BUILD 010');
    html=html.replace("const FAN_BUILD='20260817-1035-v9';","const FAN_BUILD='20260817-1941-v10';");
    html=html.replace('</body>','<script src="./build010/voice.js?v=10"><\/script></body>');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    console.error(e);
    document.body.innerHTML='<div class="loading">BUILD 010 LOAD ERROR</div>';
  }
})();
</script>
</body>
</html>

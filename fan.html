<body>
<div class="loading">BUILD 011 LOADING...</div>
<script>
(async()=>{
  try{
    const r=await fetch('./build009/part1.txt?v=11',{cache:'no-store'});
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    let html=await r.text();
    html=html.replaceAll('FAN ARCHIVE 009','FAN ARCHIVE 011').replaceAll('BUILD 009','BUILD 011');
    html=html.replace("const FAN_BUILD='20260817-1035-v9';","const FAN_BUILD='20260818-1915-v11';");
    html=html.replace('</body>','<script src="./build010/voice.js?v=11"><\/script></body>');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    console.error(e);
    document.body.innerHTML='<div class="loading">BUILD 011 LOAD ERROR</div>';
  }
})();
</script>

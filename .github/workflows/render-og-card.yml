name: Render OG card

on:
  push:
    branches:
      - agent/build-011-x-card-thumbnail
    paths:
      - og-image.jpg.b64
      - .github/workflows/render-og-card.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode JPEG
        run: base64 --decode og-image.jpg.b64 > og-image.jpg
      - name: Commit JPEG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add og-image.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Render X card JPEG"
          git push
